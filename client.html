<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Самоцветы DEV – Личный кабинет</title>
    <style>
        :root {
            --accent: #ff9f0a;
            --danger: #ff453a;
            --success: #30d158;
            --bg: #121214;
            --card-bg: #1c1c1e;
            --text: #f0f0f5;
            --text-secondary: #98989d;
            --border: #2c2c2e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); -webkit-tap-highlight-color: transparent; }
        body {
            background-image: linear-gradient(rgba(18,18,20,0.85), rgba(18,18,20,0.85)),
                              url('https://i.oneme.ru/i?r=BTE2sh_eZW7g8kugOdIm2Noti4nNqoRG8rejaPRr2859v6heFIFzMaeTRu44FG2MMX4');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 420px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 32px 24px;
            margin-bottom: 16px;
            box-shadow: 0 12px 36px rgba(0,0,0,0.6);
            border: 1px solid var(--border);
            text-align: center;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
            margin: 0 auto 16px;
            display: block;
            box-shadow: 0 0 20px rgba(255,159,10,0.4);
        }
        h2 { font-size: 24px; font-weight: 650; margin-bottom: 8px; }
        .subtitle { color: var(--text-secondary); font-size: 14px; margin-bottom: 24px; }
        input, button {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: #2c2c2e;
            color: #fff;
            font-size: 16px;
            outline: none;
            font-family: inherit;
            transition: border 0.2s;
        }
        input:focus { border-color: var(--accent); }
        button {
            background: var(--accent);
            color: #000;
            font-weight: 650;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        button:active { transform: scale(0.97); }
        button:disabled { opacity: 0.5; transform: none; }
        .hidden { display: none !important; }
        .error-message {
            color: var(--danger);
            font-size: 14px;
            margin-top: 8px;
            min-height: 20px;
        }
        a { color: var(--accent); text-decoration: none; font-weight: 500; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 12px; }
        th { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); color: var(--text-secondary); font-weight: 600; }
        td { padding: 10px 8px; border-bottom: 1px solid #1c1c1e; vertical-align: middle; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; }
        .badge-active { background: #34c759; color: #fff; }
        .badge-inactive { background: #48484a; color: #fff; }
        .profile-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
        .avatar { width: 56px; height: 56px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; font-size: 24px; object-fit: cover; }
        .button-row { display: flex; gap: 8px; margin-top: 12px; }
        .button-row button { flex: 1; }
        .spinner {
            border: 3px solid rgba(255,255,255,0.2);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <!-- Экран входа -->
        <div id="loginScreen" class="card">
            <img class="logo" src="https://sun9-52.userapi.com/s/v1/ig2/FU7bN5q2jKV6WvIw1MQODNfSCOpVecMzuP5FQdOyrofQcIcs-bIRdAjlPtoHyuC1uVQI4rGjL04epRK863qokx-Q.jpg?quality=95&as=32x32,48x48,72x72,108x108,160x160,240x240,360x360,480x480,540x540,640x640,720x720,1024x1024&from=bu&cs=1024x0" alt="Логотип">
            <h2>Вход в кабинет</h2>
            <p class="subtitle">Самоцветы DEV</p>
            <input type="text" id="loginInput" placeholder="Логин (телефон или email)">
            <input type="password" id="passwordInput" placeholder="Пароль">
            <button id="loginBtn" onclick="login()">Войти</button>
            <div class="error-message" id="loginError"></div>
            <p style="margin-top:16px;">Нет аккаунта? <a href="#" onclick="showRegister()">Зарегистрироваться</a></p>
        </div>

        <!-- Экран регистрации (изначально скрыт) -->
        <div id="registerScreen" class="card hidden">
            <img class="logo" src="https://sun9-52.userapi.com/s/v1/ig2/FU7bN5q2jKV6WvIw1MQODNfSCOpVecMzuP5FQdOyrofQcIcs-bIRdAjlPtoHyuC1uVQI4rGjL04epRK863qokx-Q.jpg?quality=95&as=32x32,48x48,72x72,108x108,160x160,240x240,360x360,480x480,540x540,640x640,720x720,1024x1024&from=bu&cs=1024x0" alt="Логотип">
            <h2>Регистрация</h2>
            <p class="subtitle">Создайте аккаунт для получения сертификатов</p>
            <input type="text" id="regPhone" placeholder="Телефон (будет логином)">
            <input type="email" id="regEmail" placeholder="Email">
            <input type="text" id="regFIO" placeholder="ФИО">
            <input type="password" id="regPassword" placeholder="Придумайте пароль">
            <button id="registerBtn" onclick="register()">Зарегистрироваться</button>
            <div class="error-message" id="regError"></div>
            <p style="margin-top:16px;"><a href="#" onclick="showLogin()">← Назад ко входу</a></p>
        </div>

        <!-- Кабинет (изначально скрыт) -->
        <div id="cabinetScreen" class="hidden">
            <div class="card">
                <div class="profile-header">
                    <img id="avatarImg" class="avatar" src="" alt="Аватар">
                    <div style="flex:1; text-align:left;">
                        <strong id="nicknameDisplay" style="font-size:20px;"></strong>
                        <p id="fioDisplay" style="color:var(--text-secondary); margin:0;"></p>
                    </div>
                    <button onclick="editProfile()" style="width:auto; padding:8px 12px; background:#444; color:#fff; border: none; border-radius: 10px;">✏️</button>
                </div>
                <button onclick="logout()" style="background:#444; color:#fff; margin-top:12px; width:100%;">🚪 Выйти</button>
            </div>
            <div class="card">
                <h3 style="margin-bottom:16px;">🎁 Доступные сертификаты</h3>
                <div id="activeCerts"><p style="color:var(--text-secondary);">Нет доступных сертификатов</p></div>
            </div>
            <div class="card">
                <h3 style="margin-bottom:16px;">📦 Использованные сертификаты</h3>
                <div id="usedCerts"><p style="color:var(--text-secondary);">Нет использованных сертификатов</p></div>
            </div>
        </div>

        <!-- Оверлей загрузки -->
        <div id="loadingOverlay" class="overlay hidden">
            <div class="spinner" style="width:48px; height:48px;"></div>
        </div>
    </div>

    <script>
        // ========== КОНФИГУРАЦИЯ ==========
        const apiUrl = 'ВАШ_API_URL';   // <-- замените на свой URL от Apps Script

        let currentClient = null;

        const loginScreen = document.getElementById('loginScreen');
        const registerScreen = document.getElementById('registerScreen');
        const cabinetScreen = document.getElementById('cabinetScreen');
        const loadingOverlay = document.getElementById('loadingOverlay');

        function showLogin() {
            loginScreen.classList.remove('hidden');
            registerScreen.classList.add('hidden');
            cabinetScreen.classList.add('hidden');
        }
        function showRegister() {
            loginScreen.classList.add('hidden');
            registerScreen.classList.remove('hidden');
            cabinetScreen.classList.add('hidden');
        }
        function showCabinet() {
            loginScreen.classList.add('hidden');
            registerScreen.classList.add('hidden');
            cabinetScreen.classList.remove('hidden');
            loadProfile();
            loadMyCerts();
        }
        function showLoading() { loadingOverlay.classList.remove('hidden'); }
        function hideLoading() { loadingOverlay.classList.add('hidden'); }

        // JSONP
        function jsonp(url, callback) {
            var script = document.createElement('script');
            var cb = 'jp_' + Math.random().toString(36).substr(2, 9);
            window[cb] = function(d) { delete window[cb]; script.remove(); callback(d); };
            script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
            document.body.appendChild(script);
        }

        // ========== ВХОД (исправлено) ==========
        function login() {
            const login = document.getElementById('loginInput').value.trim();
            const pass = document.getElementById('passwordInput').value.trim();
            if (!login || !pass) {
                document.getElementById('loginError').textContent = 'Заполните все поля';
                return;
            }
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            showLoading();
            jsonp(apiUrl + '?action=login&user=' + encodeURIComponent(login) + '&password=' + encodeURIComponent(pass), function(d) {
                btn.disabled = false;
                hideLoading();
                // Принимаем любой успешный вход, независимо от прав
                if (d.success) {
                    currentClient = login;
                    localStorage.setItem('client_login', login);
                    localStorage.setItem('client_pass', pass);
                    document.getElementById('loginError').textContent = '';
                    showCabinet();
                } else {
                    document.getElementById('loginError').textContent = d.message || 'Неверный логин или пароль';
                }
            });
        }

        // ========== РЕГИСТРАЦИЯ ==========
        function register() {
            const phone = document.getElementById('regPhone').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const fio = document.getElementById('regFIO').value.trim();
            const pass = document.getElementById('regPassword').value.trim();
            if (!phone || !pass) {
                document.getElementById('regError').textContent = 'Телефон и пароль обязательны';
                return;
            }
            const btn = document.getElementById('registerBtn');
            btn.disabled = true;
            showLoading();
            jsonp(apiUrl + '?action=clientRegister&login=' + encodeURIComponent(phone) +
                 '&password=' + encodeURIComponent(pass) +
                 '&phone=' + encodeURIComponent(phone) +
                 '&email=' + encodeURIComponent(email) +
                 '&fio=' + encodeURIComponent(fio), function(d) {
                btn.disabled = false;
                hideLoading();
                if (d.success) {
                    alert('Регистрация успешна! Теперь войдите.');
                    showLogin();
                    document.getElementById('loginInput').value = phone;
                    document.getElementById('passwordInput').value = '';
                    document.getElementById('regError').textContent = '';
                } else {
                    document.getElementById('regError').textContent = d.message || 'Ошибка регистрации';
                }
            });
        }

        // ========== ЗАГРУЗКА ПРОФИЛЯ ==========
        function loadProfile() {
            showLoading();
            jsonp(apiUrl + '?action=clientData&user=' + encodeURIComponent(currentClient), function(d) {
                hideLoading();
                if (d.error) return;
                document.getElementById('nicknameDisplay').textContent = d.nickname || 'Пользователь';
                document.getElementById('fioDisplay').textContent = d.fio || '';
                if (d.avatar) {
                    document.getElementById('avatarImg').src = d.avatar;
                } else {
                    document.getElementById('avatarImg').src = '';
                }
            });
        }

        // ========== ЗАГРУЗКА СЕРТИФИКАТОВ ==========
        function loadMyCerts() {
            showLoading();
            jsonp(apiUrl + '?action=clientCerts&user=' + encodeURIComponent(currentClient), function(d) {
                hideLoading();
                const activeDiv = document.getElementById('activeCerts');
                const usedDiv = document.getElementById('usedCerts');
                activeDiv.innerHTML = '';
                usedDiv.innerHTML = '';
                const codes = d.codes || [];
                const active = codes.filter(c => c.status !== 'Активирован');
                const used = codes.filter(c => c.status === 'Активирован');

                if (active.length === 0) {
                    activeDiv.innerHTML = '<p style="color:var(--text-secondary);">Нет доступных сертификатов</p>';
                } else {
                    const table = document.createElement('table');
                    table.innerHTML = `<thead><tr><th>Код</th><th>Статус</th><th>Действие</th></tr></thead>`;
                    const tbody = document.createElement('tbody');
                    active.forEach(c => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td><strong>${c.code}</strong></td>
                            <td><span class="badge badge-inactive">Не активирован</span></td>
                            <td><button class="small-btn" onclick="showQr('${c.code}')" style="background:var(--accent); color:#000; border:none; padding:6px 12px; border-radius:8px;">📷 QR</button></td>
                        `;
                        tbody.appendChild(tr);
                    });
                    table.appendChild(tbody);
                    activeDiv.appendChild(table);
                }

                if (used.length === 0) {
                    usedDiv.innerHTML = '<p style="color:var(--text-secondary);">Нет использованных сертификатов</p>';
                } else {
                    const table = document.createElement('table');
                    table.innerHTML = `<thead><tr><th>Код</th><th>Дата создания</th></tr></thead>`;
                    const tbody = document.createElement('tbody');
                    used.forEach(c => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `<td><strong>${c.code}</strong></td><td>${c.date}</td>`;
                        tbody.appendChild(tr);
                    });
                    table.appendChild(tbody);
                    usedDiv.appendChild(table);
                }
            });
        }

        function showQr(code) {
            const url = window.location.origin + window.location.pathname.replace('client.html','index.html') + '?code=' + code;
            window.open(url, '_blank');
        }

        function editProfile() {
            const nick = prompt('Никнейм:', document.getElementById('nicknameDisplay').textContent);
            const avatar = prompt('Ссылка на аватар:', document.getElementById('avatarImg').src);
            if (nick === null && avatar === null) return;
            showLoading();
            jsonp(apiUrl + '?action=clientUpdate&user=' + encodeURIComponent(currentClient) +
                 '&nickname=' + encodeURIComponent(nick || '') +
                 '&avatar=' + encodeURIComponent(avatar || ''), function(d) {
                hideLoading();
                if (d.success) {
                    loadProfile();
                } else {
                    alert(d.message || 'Ошибка обновления');
                }
            });
        }

        function logout() {
            currentClient = null;
            localStorage.removeItem('client_login');
            localStorage.removeItem('client_pass');
            showLogin();
        }

        // ========== АВТОВХОД ==========
        (function() {
            const savedLogin = localStorage.getItem('client_login');
            const savedPass = localStorage.getItem('client_pass');
            if (savedLogin && savedPass) {
                // Попробуем сразу войти
                jsonp(apiUrl + '?action=login&user=' + encodeURIComponent(savedLogin) + '&password=' + encodeURIComponent(savedPass), function(d) {
                    if (d.success) {
                        currentClient = savedLogin;
                        showCabinet();
                    } else {
                        // Если не получилось, показываем экран входа
                        showLogin();
                    }
                });
            } else {
                showLogin();
            }
        })();
    </script>
</body>
</html>
