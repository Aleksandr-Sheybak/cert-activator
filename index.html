<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Самоцветы DEV – Сертификаты</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; -webkit-text-size-adjust: 100%; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding: 20px;
            -webkit-tap-highlight-color: transparent;
            color: #f0f0f5;
            background: linear-gradient(rgba(18,18,20,0.85), rgba(18,18,20,0.85)),
                        url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSJ6sLOeVPZjavyj4KcZ_4x_OB7I2o8B6TpXg&s')
                        center/cover fixed;
        }

        /* Навигация */
        .nav {
            display: flex; gap: 6px; margin-bottom: 20px;
            background: rgba(30,30,32,0.8); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 6px;
            width: 100%; max-width: 420px;
        }
        .nav button {
            flex: 1; background: transparent; color: #a0a0a8; border: none;
            padding: 12px 6px; border-radius: 16px; font-size: 13px; font-weight: 600;
            cursor: pointer; transition: 0.2s; white-space: nowrap;
        }
        .nav button.active { background: #ff9f0a; color: #000; }
        .nav button.root-only { display: none; }
        .nav button.root-only.show { display: block; }

        .screen { display: none; width: 100%; max-width: 420px; }
        .screen.active { display: block; }

        .card {
            background: rgba(30,30,32,0.9); backdrop-filter: blur(15px);
            border-radius: 24px; box-shadow: 0 12px 36px rgba(0,0,0,0.6);
            padding: 28px 20px; width: 100%; text-align: center;
            border: 1px solid rgba(44,44,46,0.6);
            margin-bottom: 16px;
        }

        .logo {
            width: 64px; height: 64px; border-radius: 50%;
            object-fit: cover; margin: 0 auto 12px;
            display: block; border: 2px solid #ff9f0a;
            box-shadow: 0 0 15px rgba(255,159,10,0.3);
        }

        h2 { font-size: 22px; font-weight: 650; margin-bottom: 4px; }
        .subtitle { font-size: 13px; color: #ff9f0a; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }

        .code-block, input[type="text"], input[type="password"], select, textarea {
            background: rgba(24,24,26,0.8); border: 1px solid #2c2c2e;
            border-radius: 14px; padding: 14px; margin: 8px 0;
            font-size: 16px; color: #f0f0f5; width: 100%; outline: none;
            font-family: inherit; resize: vertical;
        }
        select { appearance: none; }

        .status { font-size: 17px; margin: 12px 0; font-weight: 500; }
        .status.error { color: #ff453a; }
        .status.success { color: #34c759; }

        button.primary {
            background: #ff9f0a; color: #000; font-size: 17px; font-weight: 650;
            padding: 14px 24px; border: none; border-radius: 30px;
            width: 100%; max-width: 280px; margin: 8px auto; cursor: pointer;
            box-shadow: 0 4px 14px rgba(255,159,10,0.35); transition: 0.15s;
        }
        button.primary:active { transform: scale(0.97); background: #e58c00; }
        button.primary:disabled { background: #555; color: #2c2c2e; box-shadow: none; }

        .danger { background: #ff453a; color: #fff; box-shadow: 0 4px 14px rgba(255,69,58,0.35); }
        .danger:active { background: #d9362e; }

        .hidden { display: none !important; }
        .user-badge { font-size: 13px; color: #8e8e93; margin-bottom: 8px; }
        .logout-link { color: #ff9f0a; font-size: 14px; margin-top: 12px; display: inline-block; text-decoration: none; }

        .data-table {
            width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 12px;
        }
        .data-table th {
            text-align: left; padding: 10px 6px; border-bottom: 1px solid #2c2c2e; color: #8e8e93; font-weight: 600;
        }
        .data-table td {
            padding: 10px 6px; border-bottom: 1px solid #1c1c1e; vertical-align: middle;
        }
        .status-badge {
            display: inline-block; padding: 4px 12px; border-radius: 12px;
            font-size: 13px; font-weight: 600;
        }
        .status-active { background: #34c759; color: #fff; }
        .status-inactive { background: #e5e5ea; color: #000; }

        .scrollable { max-height: 400px; overflow-y: auto; margin-top: 8px; }

        /* Модальное окно */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: flex; align-items: center;
            justify-content: center; z-index: 100;
        }
        .modal-content {
            background: #1e1e20; border-radius: 24px; padding: 24px;
            width: 90%; max-width: 320px; text-align: center;
        }
        .close-btn {
            color: #ff9f0a; font-size: 24px; cursor: pointer; float: right;
        }
    </style>
</head>
<body>

    <!-- НАВИГАЦИЯ -->
    <div id="navBar" class="nav hidden">
        <button id="navQR" onclick="switchScreen('qr')">📱 QR</button>
        <button id="navManual" onclick="switchScreen('manual')">⌨️ Ручная</button>
        <button id="navLogs" onclick="switchScreen('logs')">📋 Логи</button>
        <button id="navCerts" class="root-only" onclick="switchScreen('certs')">💎 Сертификаты</button>
    </div>

    <!-- ЭКРАН ВХОДА -->
    <div id="loginScreen" class="screen active">
        <div class="card">
            <img class="logo" src="https://sun9-52.userapi.com/s/v1/ig2/FU7bN5q2jKV6WvIw1MQODNfSCOpVecMzuP5FQdOyrofQcIcs-bIRdAjlPtoHyuC1uVQI4rGjL04epRK863qokx-Q.jpg?quality=95&as=32x32,48x48,72x72,108x108,160x160,240x240,360x360,480x480,540x540,640x640,720x720,1024x1024&from=bu&cs=1024x0" alt="Логотип">
            <h2>Вход в систему</h2>
            <div class="subtitle">Самоцветы DEV</div>
            <select id="userSelect">
                <option value="root">Root</option>
                <option value="volonter1">Volonter1</option>
                <option value="volonter2">Volonter2</option>
            </select>
            <input type="password" id="passwordInput" placeholder="Пароль">
            <button class="primary" onclick="login()">Войти</button>
            <div id="loginStatus" class="status error"></div>
        </div>
    </div>

    <!-- ЭКРАН QR-АКТИВАЦИИ -->
    <div id="qrScreen" class="screen">
        <div class="card">
            <img class="logo" src="https://sun9-52.userapi.com/s/v1/ig2/FU7bN5q2jKV6WvIw1MQODNfSCOpVecMzuP5FQdOyrofQcIcs-bIRdAjlPtoHyuC1uVQI4rGjL04epRK863qokx-Q.jpg?quality=95&as=32x32,48x48,72x72,108x108,160x160,240x240,360x360,480x480,540x540,640x640,720x720,1024x1024&from=bu&cs=1024x0" alt="Логотип">
            <h2>QR-активация</h2>
            <div class="user-badge" id="userLabel"></div>
            <div class="code-block" id="codeDisplay"></div>
            <div id="qrStatus" class="status"></div>
            <button id="activateBtnQR" class="primary" onclick="activateCode()">Активировать</button>
            <a class="logout-link" href="#" onclick="logout()">Выйти</a>
        </div>
    </div>

    <!-- ЭКРАН РУЧНОЙ АКТИВАЦИИ -->
    <div id="manualScreen" class="screen">
        <div class="card">
            <img class="logo" src="https://sun9-52.userapi.com/s/v1/ig2/FU7bN5q2jKV6WvIw1MQODNfSCOpVecMzuP5FQdOyrofQcIcs-bIRdAjlPtoHyuC1uVQI4rGjL04epRK863qokx-Q.jpg?quality=95&as=32x32,48x48,72x72,108x108,160x160,240x240,360x360,480x480,540x540,640x640,720x720,1024x1024&from=bu&cs=1024x0" alt="Логотип">
            <h2>Ручная активация</h2>
            <div class="user-badge" id="userLabelManual"></div>
            <input type="text" id="manualCodeInput" placeholder="Код (GF001)">
            <div id="manualStatus" class="status"></div>
            <button id="activateBtnManual" class="primary" onclick="manualActivate()">Активировать</button>
            <button id="deactivateBtnManual" class="primary danger hidden" onclick="manualDeactivate()">Отменить активацию</button>
            <a class="logout-link" href="#" onclick="logout()">Выйти</a>
        </div>
    </div>

    <!-- ЭКРАН ЛОГОВ -->
    <div id="logsScreen" class="screen">
        <div class="card">
            <img class="logo" src="https://sun9-52.userapi.com/s/v1/ig2/FU7bN5q2jKV6WvIw1MQODNfSCOpVecMzuP5FQdOyrofQcIcs-bIRdAjlPtoHyuC1uVQI4rGjL04epRK863qokx-Q.jpg?quality=95&as=32x32,48x48,72x72,108x108,160x160,240x240,360x360,480x480,540x540,640x640,720x720,1024x1024&from=bu&cs=1024x0" alt="Логотип">
            <h2>📋 Журнал действий</h2>
            <div class="scrollable">
                <table class="data-table" id="logsTable">
                    <thead><tr><th>Время</th><th>Польз.</th><th>Действие</th><th>Код</th><th>Рез-т</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
            <button class="primary" style="margin-top:12px;" onclick="loadLogs()">Обновить</button>
            <a class="logout-link" href="#" onclick="logout()">Выйти</a>
        </div>
    </div>

    <!-- ЭКРАН УПРАВЛЕНИЯ СЕРТИФИКАТАМИ (Root) -->
    <div id="certsScreen" class="screen">
        <div class="card">
            <img class="logo" src="https://sun9-52.userapi.com/s/v1/ig2/FU7bN5q2jKV6WvIw1MQODNfSCOpVecMzuP5FQdOyrofQcIcs-bIRdAjlPtoHyuC1uVQI4rGjL04epRK863qokx-Q.jpg?quality=95&as=32x32,48x48,72x72,108x108,160x160,240x240,360x360,480x480,540x540,640x640,720x720,1024x1024&from=bu&cs=1024x0" alt="Логотип">
            <h2>💎 Все сертификаты</h2>
            <div class="user-badge" id="userLabelCerts"></div>

            <!-- Кнопка создания нового -->
            <button class="primary" onclick="openCreateModal()" style="margin-bottom:16px;">➕ Создать новый сертификат</button>

            <div class="scrollable">
                <table class="data-table" id="certsTable">
                    <thead><tr><th>Код</th><th>Статус</th><th>Создан</th><th>Срок</th><th>Комментарий</th><th>QR</th><th>Откат</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
            <button class="primary" style="margin-top:12px;" onclick="loadCertificates()">Обновить</button>
            <a class="logout-link" href="#" onclick="logout()">Выйти</a>
        </div>
    </div>

    <!-- Модальное окно создания сертификата -->
    <div id="createModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="closeCreateModal()">&times;</span>
            <h2>Создать сертификат</h2>
            <input type="text" id="newCode" placeholder="Код (например GF100)">
            <select id="newDuration">
                <option value="1 день">1 день</option>
                <option value="3 дня">3 дня</option>
                <option value="10 дней">10 дней</option>
                <option value="30 дней">30 дней</option>
                <option value="бессрочно" selected>Бессрочно</option>
            </select>
            <textarea id="newComment" rows="2" placeholder="Комментарий (необязательно)"></textarea>
            <button class="primary" onclick="createCertificate()">Создать</button>
            <div id="createStatus" class="status" style="margin-top:12px;"></div>
        </div>
    </div>

    <!-- Модальное окно для QR-кода -->
    <div id="qrModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="closeQrModal()">&times;</span>
            <h3 id="qrCodeTitle"></h3>
            <img id="qrImage" src="" alt="QR-код" style="width:100%; max-width:250px; margin:12px auto; display:block;">
            <p style="font-size:14px; color:#a0a0a8;">Сканируйте или скопируйте ссылку</p>
            <input type="text" id="qrLink" readonly style="font-size:12px;">
            <button class="primary" onclick="copyQrLink()" style="margin-top:8px;">Копировать ссылку</button>
        </div>
    </div>

    <script>
        // ---------- КОНФИГУРАЦИЯ ----------
        const apiUrl = 'ВАШ_API_URL'; // ⚡ ВСТАВЬТЕ ВАШ URL Apps Script

        const USERS = {
            'root': 'space1987',
            'volonter1': 'v321',
            'volonter2': 'v987'
        };

        // ---------- DOM-элементы ----------
        const loginScreen = document.getElementById('loginScreen');
        const qrScreen = document.getElementById('qrScreen');
        const manualScreen = document.getElementById('manualScreen');
        const logsScreen = document.getElementById('logsScreen');
        const certsScreen = document.getElementById('certsScreen');
        const navBar = document.getElementById('navBar');
        const navQR = document.getElementById('navQR');
        const navManual = document.getElementById('navManual');
        const navLogs = document.getElementById('navLogs');
        const navCerts = document.getElementById('navCerts');
        const userLabel = document.getElementById('userLabel');
        const userLabelManual = document.getElementById('userLabelManual');
        const userLabelCerts = document.getElementById('userLabelCerts');
        const codeDisplay = document.getElementById('codeDisplay');
        const qrStatus = document.getElementById('qrStatus');
        const activateBtnQR = document.getElementById('activateBtnQR');
        const manualCodeInput = document.getElementById('manualCodeInput');
        const manualStatus = document.getElementById('manualStatus');
        const activateBtnManual = document.getElementById('activateBtnManual');
        const deactivateBtnManual = document.getElementById('deactivateBtnManual');
        const logsTableBody = document.querySelector('#logsTable tbody');
        const certsTableBody = document.querySelector('#certsTable tbody');
        const createModal = document.getElementById('createModal');
        const qrModal = document.getElementById('qrModal');
        const qrImage = document.getElementById('qrImage');
        const qrCodeTitle = document.getElementById('qrCodeTitle');
        const qrLink = document.getElementById('qrLink');

        let currentUser = null;

        // ---------- СЕССИЯ ----------
        function saveSession(user) { localStorage.setItem('cert_user', user); localStorage.setItem('cert_logged_in', 'true'); }
        function clearSession() { localStorage.removeItem('cert_user'); localStorage.removeItem('cert_logged_in'); }
        function getSavedUser() {
            const loggedIn = localStorage.getItem('cert_logged_in') === 'true';
            const user = localStorage.getItem('cert_user');
            return loggedIn && user ? user : null;
        }

        // ---------- ПЕРЕКЛЮЧЕНИЕ ЭКРАНОВ ----------
        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            navQR.classList.remove('active'); navManual.classList.remove('active');
            navLogs.classList.remove('active'); navCerts.classList.remove('active');

            if (screenId === 'qr') {
                qrScreen.classList.add('active'); navQR.classList.add('active'); updateQRStatus();
            } else if (screenId === 'manual') {
                manualScreen.classList.add('active'); navManual.classList.add('active'); loadManualCodeStatus();
            } else if (screenId === 'logs') {
                logsScreen.classList.add('active'); navLogs.classList.add('active'); loadLogs();
            } else if (screenId === 'certs') {
                certsScreen.classList.add('active'); navCerts.classList.add('active'); loadCertificates();
            }
        }

        // ---------- JSONP ----------
        function jsonp(url, callback) {
            var script = document.createElement('script');
            var cbName = 'jsonp_cb_' + Math.round(Math.random()*100000);
            window[cbName] = function(data) { delete window[cbName]; script.remove(); callback(data); };
            script.src = url + (url.indexOf('?')>=0 ? '&' : '?') + 'callback=' + cbName;
            document.body.appendChild(script);
        }

        function userParam() { return currentUser || 'неизвестный'; }

        // ---------- QR ЭКРАН ----------
        const urlParams = new URLSearchParams(window.location.search);
        const qrCode = urlParams.get('code');

        function updateQRStatus() {
            if (!qrCode) {
                codeDisplay.textContent = '—';
                qrStatus.textContent = 'Нет кода в ссылке'; qrStatus.className = 'status error';
                activateBtnQR.classList.add('hidden'); return;
            }
            codeDisplay.textContent = qrCode;
            jsonp(apiUrl + '?action=status&code=' + encodeURIComponent(qrCode), function(data) {
                if (data.error || data.status === 'unknown') {
                    qrStatus.textContent = '❌ Неизвестный код'; qrStatus.className = 'status error';
                    activateBtnQR.classList.add('hidden');
                } else if (data.status === 'Активирован') {
                    qrStatus.textContent = '❌ Сертификат уже активирован'; qrStatus.className = 'status error';
                    activateBtnQR.classList.add('hidden');
                } else {
                    qrStatus.textContent = ''; qrStatus.className = 'status';
                    activateBtnQR.classList.remove('hidden');
                }
            });
        }

        function activateCode() {
            if (!qrCode) return;
            activateBtnQR.disabled = true; activateBtnQR.textContent = 'Активация...';
            jsonp(apiUrl + '?action=activate&code=' + encodeURIComponent(qrCode) + '&user=' + userParam(), function(data) {
                if (data.success) {
                    qrStatus.textContent = '✅ ' + data.message; qrStatus.className = 'status success';
                    activateBtnQR.classList.add('hidden');
                } else {
                    qrStatus.textContent = '❌ ' + data.message; qrStatus.className = 'status error';
                    activateBtnQR.disabled = false; activateBtnQR.textContent = 'Активировать';
                }
            });
        }

        // ---------- РУЧНАЯ АКТИВАЦИЯ ----------
        function manualActivate() {
            var code = manualCodeInput.value.trim().replace(/[^A-Za-z0-9]/g, '');
            if (!code) { manualStatus.textContent = 'Введите код'; manualStatus.className = 'status error'; return; }
            activateBtnManual.disabled = true; deactivateBtnManual.disabled = true;
            jsonp(apiUrl + '?action=activate&code=' + code + '&user=' + userParam(), function(data) {
                if (data.success) {
                    manualStatus.textContent = '✅ ' + data.message; manualStatus.className = 'status success';
                    activateBtnManual.classList.add('hidden'); deactivateBtnManual.classList.remove('hidden');
                } else {
                    manualStatus.textContent = '❌ ' + data.message; manualStatus.className = 'status error';
                    activateBtnManual.disabled = false; deactivateBtnManual.disabled = false;
                }
            });
        }

        function manualDeactivate() {
            var code = manualCodeInput.value.trim().replace(/[^A-Za-z0-9]/g, '');
            if (!code) return;
            activateBtnManual.disabled = true; deactivateBtnManual.disabled = true;
            jsonp(apiUrl + '?action=deactivate&code=' + code + '&user=' + userParam(), function(data) {
                if (data.success) {
                    manualStatus.textContent = '✅ ' + data.message; manualStatus.className = 'status success';
                    deactivateBtnManual.classList.add('hidden'); activateBtnManual.classList.remove('hidden');
                } else {
                    manualStatus.textContent = '❌ ' + data.message; manualStatus.className = 'status error';
                    activateBtnManual.disabled = false; deactivateBtnManual.disabled = false;
                }
            });
        }

        function loadManualCodeStatus() {
            var code = manualCodeInput.value.trim().replace(/[^A-Za-z0-9]/g, '');
            if (!code) {
                manualStatus.textContent = '';
                activateBtnManual.classList.remove('hidden'); deactivateBtnManual.classList.add('hidden');
                return;
            }
            jsonp(apiUrl + '?action=status&code=' + code, function(data) {
                if (data.status === 'Активирован') {
                    activateBtnManual.classList.add('hidden'); deactivateBtnManual.classList.remove('hidden');
                } else {
                    activateBtnManual.classList.remove('hidden'); deactivateBtnManual.classList.add('hidden');
                }
                activateBtnManual.disabled = false; deactivateBtnManual.disabled = false;
                manualStatus.textContent = '';
            });
        }
        manualCodeInput.addEventListener('input', loadManualCodeStatus);

        // ---------- ЛОГИ ----------
        function loadLogs() {
            jsonp(apiUrl + '?action=logs', function(data) {
                if (data.error) return;
                var logs = data.logs || [];
                logsTableBody.innerHTML = '';
                logs.forEach(function(row) {
                    var tr = document.createElement('tr');
                    tr.innerHTML = `<td>${row[0]||''}</td><td>${row[1]||''}</td><td>${row[2]||''}</td><td>${row[3]||''}</td><td>${row[4]||''}</td>`;
                    logsTableBody.appendChild(tr);
                });
            });
        }

        // ---------- УПРАВЛЕНИЕ СЕРТИФИКАТАМИ ----------
        function loadCertificates() {
            jsonp(apiUrl + '?action=list', function(data) {
                if (data.error) return;
                var codes = data.codes || [];
                certsTableBody.innerHTML = '';
                codes.forEach(function(item) {
                    var tr = document.createElement('tr');
                    var statusClass = item.status === 'Активирован' ? 'status-active' : 'status-inactive';
                    var rollbackBtn = (item.status === 'Активирован' && currentUser === 'root')
                        ? `<button class="primary danger" style="padding:4px 10px; font-size:12px; width:auto;" onclick="rollbackCertificate('${item.code}')">↩️</button>`
                        : '—';
                    var qrBtn = `<button class="primary" style="padding:4px 10px; font-size:12px; width:auto;" onclick="showQrCode('${item.code}')">📷</button>`;
                    tr.innerHTML = `
                        <td><strong>${item.code}</strong></td>
                        <td><span class="status-badge ${statusClass}">${item.status}</span></td>
                        <td>${item.date}</td>
                        <td>${item.duration}</td>
                        <td>${item.comment}</td>
                        <td>${qrBtn}</td>
                        <td>${rollbackBtn}</td>
                    `;
                    certsTableBody.appendChild(tr);
                });
                userLabelCerts.textContent = 'Вы: ' + currentUser;
            });
        }

        function rollbackCertificate(code) {
            if (!confirm(`Откатить активацию ${code}?`)) return;
            jsonp(apiUrl + '?action=deactivate&code=' + code + '&user=' + userParam(), function(data) {
                if (data.success) {
                    alert('Откат выполнен.');
                    loadCertificates();
                } else {
                    alert('Ошибка: ' + data.message);
                }
            });
        }

        // ---------- МОДАЛЬНОЕ ОКНО СОЗДАНИЯ ----------
        function openCreateModal() {
            document.getElementById('newCode').value = '';
            document.getElementById('newDuration').value = 'бессрочно';
            document.getElementById('newComment').value = '';
            document.getElementById('createStatus').textContent = '';
            createModal.classList.remove('hidden');
        }

        function closeCreateModal() {
            createModal.classList.add('hidden');
        }

        function createCertificate() {
            var code = document.getElementById('newCode').value.trim().replace(/[^A-Za-z0-9]/g, '');
            var duration = document.getElementById('newDuration').value;
            var comment = document.getElementById('newComment').value.trim();
            if (!code) {
                document.getElementById('createStatus').textContent = 'Введите код';
                document.getElementById('createStatus').className = 'status error';
                return;
            }
            var btn = document.querySelector('#createModal button.primary');
            btn.disabled = true;
            btn.textContent = 'Создание...';
            jsonp(apiUrl + '?action=create&code=' + encodeURIComponent(code)
                + '&duration=' + encodeURIComponent(duration)
                + '&comment=' + encodeURIComponent(comment)
                + '&user=' + encodeURIComponent(userParam()), function(data) {
                    btn.disabled = false;
                    btn.textContent = 'Создать';
                    if (data.success) {
                        document.getElementById('createStatus').textContent = '✅ ' + data.message;
                        document.getElementById('createStatus').className = 'status success';
                        loadCertificates(); // обновить список
                        setTimeout(closeCreateModal, 1000);
                    } else {
                        document.getElementById('createStatus').textContent = '❌ ' + data.message;
                        document.getElementById('createStatus').className = 'status error';
                    }
                });
        }

        // ---------- QR-КОД В МОДАЛЬНОМ ОКНЕ ----------
        function showQrCode(code) {
            var baseUrl = window.location.href.split('?')[0]; // текущий URL без параметров
            var activationUrl = baseUrl + '?code=' + code;
            qrCodeTitle.textContent = 'QR-код для ' + code;
            qrImage.src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(activationUrl);
            qrLink.value = activationUrl;
            qrModal.classList.remove('hidden');
        }

        function closeQrModal() {
            qrModal.classList.add('hidden');
        }

        function copyQrLink() {
            qrLink.select();
            document.execCommand('copy');
            alert('Ссылка скопирована!');
        }

        // ---------- АВТОРИЗАЦИЯ ----------
        function login() {
            var user = document.getElementById('userSelect').value;
            var pass = document.getElementById('passwordInput').value.trim();
            if (!pass) { document.getElementById('loginStatus').textContent = 'Введите пароль'; return; }
            if (USERS[user] === pass) {
                currentUser = user;
                saveSession(user);
                showMainInterface();
            } else {
                document.getElementById('loginStatus').textContent = 'Неверный пароль';
            }
        }

        function logout() {
            clearSession(); currentUser = null;
            loginScreen.classList.add('active'); navBar.classList.add('hidden');
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('passwordInput').value = '';
            document.getElementById('loginStatus').textContent = '';
        }

        function showMainInterface() {
            loginScreen.classList.remove('active'); navBar.classList.remove('hidden');
            userLabel.textContent = 'Вы: ' + currentUser;
            userLabelManual.textContent = 'Вы: ' + currentUser;
            userLabelCerts.textContent = 'Вы: ' + currentUser;

            if (currentUser === 'root') {
                navCerts.classList.add('show');
                deactivateBtnManual.classList.remove('hidden');
            } else {
                navCerts.classList.remove('show');
                deactivateBtnManual.classList.add('hidden');
            }

            switchScreen('qr');
            if (qrCode) updateQRStatus();
        }

        // ---------- ИНИЦИАЛИЗАЦИЯ ----------
        (function() {
            var savedUser = getSavedUser();
            if (savedUser && USERS.hasOwnProperty(savedUser)) {
                currentUser = savedUser;
                showMainInterface();
            } else {
                loginScreen.classList.add('active'); navBar.classList.add('hidden');
            }
        })();
    </script>
</body>
</html>
