<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Самоцветы DEV – Сертификаты</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        :root {
            --sidebar-width: 260px;
            --header-height: 56px;
            --accent: #ff9f0a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #121214; color: #f0f0f5; -webkit-tap-highlight-color: transparent; }
        body { display: flex; flex-direction: column; }

        /* Header */
        .header {
            height: var(--header-height); background: #1e1e20; display: flex; align-items: center; padding: 0 16px;
            border-bottom: 1px solid #2c2c2e; position: fixed; top: 0; left: 0; right: 0; z-index: 20;
        }
        .menu-btn {
            background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; margin-right: 16px;
            display: flex; align-items: center;
        }
        .header-title {
            font-size: 18px; font-weight: 600; color: #fff;
        }
        .logo-img {
            height: 32px; width: 32px; border-radius: 50%; margin-right: 8px; object-fit: cover; border: 1px solid var(--accent);
        }

        /* Sidebar */
        .sidebar {
            position: fixed; top: var(--header-height); left: 0; bottom: 0;
            width: var(--sidebar-width); background: #1a1a1c; border-right: 1px solid #2c2c2e;
            transform: translateX(-100%); transition: transform 0.3s ease; z-index: 15;
            padding: 20px 0; overflow-y: auto;
        }
        .sidebar.open { transform: translateX(0); }
        .sidebar ul { list-style: none; padding: 0; }
        .sidebar li a, .sidebar li button {
            display: block; width: 100%; padding: 14px 24px; color: #ccc; text-decoration: none;
            font-size: 16px; background: none; border: none; text-align: left; cursor: pointer;
            transition: background 0.2s;
        }
        .sidebar li a:hover, .sidebar li button:hover { background: #2c2c2e; color: #fff; }
        .sidebar li a.active, .sidebar li button.active { color: var(--accent); background: #1f1f21; }

        /* Main content */
        .main {
            margin-top: var(--header-height); margin-left: 0;
            padding: 20px; flex: 1; transition: margin-left 0.3s;
        }
        .page { display: none; }
        .page.active { display: block; }

        /* Cards & tables */
        .card {
            background: #1e1e20; border-radius: 24px; padding: 20px;
            margin-bottom: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        .back-btn {
            background: none; border: none; color: var(--accent); font-size: 20px; margin-bottom: 12px; cursor: pointer;
        }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { text-align: left; padding: 8px 6px; border-bottom: 1px solid #2c2c2e; color: #aaa; font-weight: 600; }
        td { padding: 8px 6px; border-bottom: 1px solid #1c1c1e; }
        .badge {
            display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px; font-weight: 600;
        }
        .badge-active { background: #34c759; color: #fff; }
        .badge-inactive { background: #e5e5ea; color: #000; }
        .badge-issued { background: #007aff; color: #fff; }
        .badge-stock { background: #636366; color: #fff; }
        button.small { padding: 4px 10px; font-size: 12px; border-radius: 14px; min-width: auto; }
        .hidden { display: none !important; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .modal-content { background: #1e1e20; border-radius: 24px; padding: 24px; max-width: 340px; width: 90%; position: relative; }
        .close-btn { position: absolute; top: 10px; right: 15px; color: var(--accent); font-size: 24px; cursor: pointer; }

        /* responsive */
        @media (min-width: 768px) {
            .sidebar { transform: translateX(0); }
            .main { margin-left: var(--sidebar-width); }
            .menu-btn { display: none; }
        }
        /* для очень маленьких экранов убираем горизонтальный скролл таблиц */
        .table-wrap { overflow-x: auto; }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <img class="logo-img" src="https://sun9-52.userapi.com/s/v1/ig2/FU7bN5q2jKV6WvIw1MQODNfSCOpVecMzuP5FQdOyrofQcIcs-bIRdAjlPtoHyuC1uVQI4rGjL04epRK863qokx-Q.jpg?quality=95&as=32x32,48x48,72x72,108x108,160x160,240x240,360x360,480x480,540x540,640x640,720x720,1024x1024&from=bu&cs=1024x0" alt="лого">
        <span class="header-title">Самоцветы DEV</span>
    </header>

    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <ul>
            <li><button onclick="navigate('home')" id="navHome">🏠 Главная</button></li>
            <li id="certsMenuItem" class="hidden"><button onclick="navigate('certs')" id="navCerts">💎 Сертификаты</button></li>
            <li id="archiveMenuItem" class="hidden"><button onclick="navigate('archive')" id="navArchive">📦 Архив</button></li>
            <li><button onclick="navigate('logs')" id="navLogs">📋 Логи</button></li>
            <li><button onclick="logout()">🚪 Выйти</button></li>
        </ul>
    </nav>

    <!-- Main content -->
    <div class="main" id="mainContent">
        <!-- страница входа (будет показываться, пока не вошли) -->
        <div id="loginPage" class="page active">
            <div class="card">
                <img src="https://sun9-52.userapi.com/s/v1/ig2/FU7bN5q2jKV6WvIw1MQODNfSCOpVecMzuP5FQdOyrofQcIcs-bIRdAjlPtoHyuC1uVQI4rGjL04epRK863qokx-Q.jpg?quality=95&as=32x32,48x48,72x72,108x108,160x160,240x240,360x360,480x480,540x540,640x640,720x720,1024x1024&from=bu&cs=1024x0" style="width:64px; border-radius:50%; margin-bottom:12px;">
                <h2>Вход в систему</h2>
                <select id="userSelect" style="width:100%; padding:12px; margin:8px 0; background:#18181a; color:#fff; border:1px solid #2c2c2e; border-radius:10px;">
                    <option value="root">Root</option>
                    <option value="volonter1">Volonter1</option>
                    <option value="volonter2">Volonter2</option>
                </select>
                <input type="password" id="passwordInput" placeholder="Пароль" style="width:100%; padding:12px; margin:8px 0; background:#18181a; color:#fff; border:1px solid #2c2c2e; border-radius:10px;">
                <button class="primary" onclick="login()" style="background:var(--accent); color:#000; padding:12px; border:none; border-radius:20px; width:100%; font-weight:600;">Войти</button>
                <div id="loginStatus" style="color:red; margin-top:8px;"></div>
            </div>
        </div>

        <!-- Главная (QR-активация) -->
        <div id="homePage" class="page">
            <div class="card">
                <h2 style="margin-bottom:16px;">Активация сертификата</h2>
                <div id="codeDisplay" style="background:#18181a; padding:16px; border-radius:12px; margin-bottom:12px; font-size:20px; text-align:center;">—</div>
                <div id="qrStatus" style="margin-bottom:12px;"></div>
                <button id="activateBtn" style="background:var(--accent); color:#000; padding:12px 20px; border:none; border-radius:20px; width:100%;" onclick="activateCode()" class="hidden">Активировать</button>
                <div style="margin-top:12px; display:flex; gap:8px; justify-content:center;">
                    <button class="small primary" onclick="openScanner()" style="background:#2c2c2e; color:#fff;">📷 Сканировать</button>
                    <button class="small primary" onclick="openGallery()" style="background:#2c2c2e; color:#fff;">🖼️ Загрузить</button>
                </div>
            </div>
        </div>

        <!-- Сертификаты -->
        <div id="certsPage" class="page">
            <button class="back-btn" onclick="navigate('home')">← Назад</button>
            <div class="card">
                <h2>Управление сертификатами</h2>
                <button onclick="openCreateModal()" style="background:var(--accent); color:#000; margin:12px 0;">➕ Создать</button>
                <div class="table-wrap">
                    <table id="certsTable">
                        <thead><tr><th>Код</th><th>Активация</th><th>Выдан</th><th>Действия</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Архив -->
        <div id="archivePage" class="page">
            <button class="back-btn" onclick="navigate('home')">← Назад</button>
            <div class="card">
                <h2>Архив активированных</h2>
                <div class="table-wrap">
                    <table id="archiveTable">
                        <thead><tr><th>Код</th><th>Дата создания</th><th>Выдан</th><th>Действия</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Логи -->
        <div id="logsPage" class="page">
            <div class="card">
                <h2>Журнал действий</h2>
                <div class="table-wrap">
                    <table id="logsTable">
                        <thead><tr><th>Время</th><th>Польз.</th><th>Действие</th><th>Код</th><th>Рез-т</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
                <button onclick="loadLogs()" style="margin-top:8px; background:#2c2c2e; color:#fff;">Обновить</button>
            </div>
        </div>
    </div>

    <!-- Модальные окна -->
    <div id="createModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="closeCreateModal()">&times;</span>
            <h3>Создать сертификат</h3>
            <input type="text" id="newCode" placeholder="Код">
            <select id="newDuration"><option value="1 день">1 день</option><option value="3 дня">3 дня</option><option value="10 дней">10 дней</option><option value="30 дней">30 дней</option><option value="бессрочно" selected>Бессрочно</option></select>
            <textarea id="newComment" placeholder="Комментарий"></textarea>
            <button onclick="createCertificate()" style="background:var(--accent); color:#000;">Создать</button>
            <div id="createStatus"></div>
        </div>
    </div>
    <div id="detailsModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="closeDetails()">&times;</span>
            <h3 id="detailsTitle"></h3>
            <div id="detailsContent"></div>
        </div>
    </div>
    <div id="qrModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="closeQr()">&times;</span>
            <h3 id="qrTitle"></h3>
            <img id="qrImg" style="width:100%; max-width:250px;">
            <input id="qrLink" readonly>
            <button onclick="copyQr()">Копировать ссылку</button>
        </div>
    </div>
    <div id="scannerModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="closeScanner()">&times;</span>
            <h3>Сканирование</h3>
            <video id="scannerVideo" autoplay playsinline></video>
            <p id="scannerStatus"></p>
        </div>
    </div>
    <input type="file" id="galleryInput" accept="image/*" onchange="handleFileUpload(event)" class="hidden">

    <script>
        // ========== КОНФИГУРАЦИЯ ==========
        const apiUrl = 'https://script.google.com/macros/s/AKfycbxKwQqAtjyR5badwA5aP6yuOTOYAPHQedYMgErQpCnB9Rf0Vrz2DuiiuEoO1u4pon0i/exec';   // <-- замените на ваш URL
        const USERS = { root: 'space1987', volonter1: 'v321', volonter2: 'v987' };

        // состояние
        let currentUser = null;
        let currentScreen = 'home';
        let sidebarOpen = false;
        let qrCode = null;

        // DOM
        const sidebar = document.getElementById('sidebar');
        const main = document.getElementById('mainContent');
        const pages = {
            login: document.getElementById('loginPage'),
            home: document.getElementById('homePage'),
            certs: document.getElementById('certsPage'),
            archive: document.getElementById('archivePage'),
            logs: document.getElementById('logsPage')
        };
        const activateBtn = document.getElementById('activateBtn');
        const codeDisplay = document.getElementById('codeDisplay');
        const qrStatus = document.getElementById('qrStatus');
        const scannerModal = document.getElementById('scannerModal');
        const scannerVideo = document.getElementById('scannerVideo');
        const scannerStatus = document.getElementById('scannerStatus');
        const galleryInput = document.getElementById('galleryInput');
        let scanningActive = false;

        // ========== УТИЛИТЫ ==========
        function jsonp(url, callback) {
            var script = document.createElement('script');
            var cb = 'jp_' + Math.random().toString(36).substr(2, 9);
            window[cb] = function(d) { delete window[cb]; script.remove(); callback(d); };
            script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
            document.body.appendChild(script);
        }

        function userParam() { return currentUser || 'неизвестный'; }

        function showPage(name) {
            Object.keys(pages).forEach(k => pages[k].classList.remove('active'));
            if (pages[name]) pages[name].classList.add('active');
            currentScreen = name;
            // подсветка в меню
            document.querySelectorAll('.sidebar button').forEach(b => b.classList.remove('active'));
            document.getElementById('navHome').classList.toggle('active', name === 'home');
            document.getElementById('navCerts').classList.toggle('active', name === 'certs');
            document.getElementById('navArchive').classList.toggle('active', name === 'archive');
            document.getElementById('navLogs').classList.toggle('active', name === 'logs');
            if (name === 'home') updateHome();
            if (name === 'certs') loadCertificates();
            if (name === 'archive') loadArchive();
            if (name === 'logs') loadLogs();
            closeSidebar();
        }

        function navigate(name) {
            showPage(name);
        }

        function toggleSidebar() {
            sidebarOpen = !sidebarOpen;
            sidebar.classList.toggle('open', sidebarOpen);
        }

        function closeSidebar() {
            sidebarOpen = false;
            sidebar.classList.remove('open');
        }

        // ========== АВТОРИЗАЦИЯ ==========
        function login() {
            const user = document.getElementById('userSelect').value;
            const pass = document.getElementById('passwordInput').value.trim();
            if (!pass) { document.getElementById('loginStatus').textContent = 'Введите пароль'; return; }
            if (USERS[user] === pass) {
                currentUser = user;
                localStorage.setItem('cert_user', user);
                localStorage.setItem('cert_logged_in', 'true');
                initUI();
            } else {
                document.getElementById('loginStatus').textContent = 'Неверный пароль';
            }
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('cert_user');
            localStorage.removeItem('cert_logged_in');
            pages.login.classList.add('active');
            Object.keys(pages).forEach(k => { if (k !== 'login') pages[k].classList.remove('active'); });
            closeSidebar();
            document.getElementById('passwordInput').value = '';
            document.getElementById('loginStatus').textContent = '';
        }

        function initUI() {
            pages.login.classList.remove('active');
            // настройка видимости меню
            const isRoot = (currentUser === 'root');
            document.getElementById('certsMenuItem').classList.toggle('hidden', !isRoot);
            document.getElementById('archiveMenuItem').classList.toggle('hidden', !isRoot);
            showPage('home');
        }

        // ========== ГЛАВНАЯ (QR) ==========
        function updateHome() {
            qrCode = getUrlParam('code');
            if (qrCode) {
                codeDisplay.textContent = qrCode;
                checkStatusForActivation(qrCode);
            } else {
                codeDisplay.textContent = '—';
                qrStatus.textContent = '';
                activateBtn.classList.add('hidden');
            }
        }

        function getUrlParam(name) {
            return new URLSearchParams(window.location.search).get(name);
        }

        function checkStatusForActivation(code) {
            jsonp(apiUrl + '?action=status&code=' + code, function(d) {
                if (d.error || d.status === 'unknown') {
                    qrStatus.textContent = '❌ Неизвестный код';
                    activateBtn.classList.add('hidden');
                } else if (d.status === 'Активирован') {
                    qrStatus.textContent = '❌ Уже активирован';
                    activateBtn.classList.add('hidden');
                } else {
                    qrStatus.textContent = '';
                    activateBtn.classList.remove('hidden');
                }
            });
        }

        function activateCode() {
            if (!qrCode) return;
            activateBtn.disabled = true;
            jsonp(apiUrl + '?action=activate&code=' + qrCode + '&user=' + userParam(), function(d) {
                activateBtn.disabled = false;
                if (d.success) {
                    qrStatus.innerHTML = '✅ ' + d.message;
                    activateBtn.classList.add('hidden');
                } else {
                    qrStatus.innerHTML = '❌ ' + d.message;
                }
            });
        }

        // Сканер и галерея (прежние функции, без изменений)
        function openScanner() {
            scannerModal.classList.remove('hidden');
            scanningActive = true;
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(stream => {
                scannerVideo.srcObject = stream;
                scannerVideo.play();
                scanLoop();
            }).catch(() => scannerStatus.textContent = 'Нет доступа к камере');
        }
        function scanLoop() {
            if (!scanningActive) return;
            if (scannerVideo.readyState === scannerVideo.HAVE_ENOUGH_DATA) {
                const canvas = document.createElement('canvas');
                canvas.width = scannerVideo.videoWidth; canvas.height = scannerVideo.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(scannerVideo, 0, 0);
                const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(data.data, canvas.width, canvas.height);
                if (code) { scanningActive = false; closeScanner(); setQrCode(code.data); }
            }
            requestAnimationFrame(scanLoop);
        }
        function closeScanner() {
            scanningActive = false;
            if (scannerVideo.srcObject) scannerVideo.srcObject.getTracks().forEach(t => t.stop());
            scannerModal.classList.add('hidden');
        }
        function openGallery() { galleryInput.click(); }
        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width; canvas.height = img.height;
                    canvas.getContext('2d').drawImage(img, 0, 0);
                    const data = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(data.data, canvas.width, canvas.height);
                    if (code) setQrCode(code.data);
                    else alert('QR не найден');
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
            galleryInput.value = '';
        }
        function setQrCode(code) {
            qrCode = code;
            codeDisplay.textContent = code;
            checkStatusForActivation(code);
            // обновить URL без перезагрузки
            window.history.replaceState(null, '', '?code=' + code);
        }

        // ========== СЕРТИФИКАТЫ ==========
        function loadCertificates() {
            jsonp(apiUrl + '?action=list', function(d) {
                const tbody = document.querySelector('#certsTable tbody');
                tbody.innerHTML = '';
                (d.codes || []).forEach(item => {
                    const tr = document.createElement('tr');
                    const issueBtn = (currentUser === 'root') ? 
                        `<button class="small" onclick="toggleIssue('${item.code}')">${item.issued === 'Отдан' ? '📦 На склад' : '📤 Отдать'}</button>` : '';
                    tr.innerHTML = `
                        <td><strong>${item.code}</strong></td>
                        <td><span class="badge ${item.status === 'Активирован' ? 'badge-active' : 'badge-inactive'}">${item.status}</span></td>
                        <td><span class="badge ${item.issued === 'Отдан' ? 'badge-issued' : 'badge-stock'}">${item.issued || 'На складе'}</span></td>
                        <td>
                            <button class="small" onclick="showDetails('${item.code}')">🔍</button>
                            ${issueBtn}
                            <button class="small" onclick="showQr('${item.code}')">📷</button>
                            <button class="small" onclick="downloadCert('${item.code}')">⬇️</button>
                            ${item.status === 'Активирован' ? `<button class="small danger" onclick="rollback('${item.code}')">↩️</button>` : ''}
                        </td>`;
                    tbody.appendChild(tr);
                });
            });
        }

        function toggleIssue(code) {
            jsonp(apiUrl + '?action=toggleIssue&code=' + code + '&user=' + userParam(), function(d) {
                if (d.success) loadCertificates();
                else alert(d.message);
            });
        }

        function showDetails(code) {
            jsonp(apiUrl + '?action=list', function(d) {
                const item = (d.codes || []).find(c => c.code === code);
                if (!item) return;
                document.getElementById('detailsTitle').textContent = 'Детали ' + code;
                document.getElementById('detailsContent').innerHTML = `
                    <p>Статус активации: <strong>${item.status}</strong></p>
                    <p>Дата создания: ${item.date}</p>
                    <p>Срок действия: ${item.duration}</p>
                    <p>Комментарий: ${item.comment}</p>
                    <p>Выдан: ${item.issued || 'На складе'}</p>`;
                document.getElementById('detailsModal').classList.remove('hidden');
            });
        }
        function closeDetails() { document.getElementById('detailsModal').classList.add('hidden'); }

        function showQr(code) {
            const url = window.location.origin + window.location.pathname + '?code=' + code;
            document.getElementById('qrTitle').textContent = 'QR для ' + code;
            document.getElementById('qrImg').src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(url);
            document.getElementById('qrLink').value = url;
            document.getElementById('qrModal').classList.remove('hidden');
        }
        function closeQr() { document.getElementById('qrModal').classList.add('hidden'); }
        function copyQr() { navigator.clipboard.writeText(document.getElementById('qrLink').value); alert('Скопировано'); }

        function downloadCert(code) {
            const url = window.location.origin + window.location.pathname + '?code=' + code;
            const canvas = document.createElement('canvas'); canvas.width = 600; canvas.height = 400;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#fff'; ctx.fillRect(0,0,600,400);
            const img = new Image();
            img.crossOrigin = 'Anonymous';
            img.onload = function() {
                ctx.drawImage(img, 380, 180, 200, 200);
                ctx.fillStyle = '#000'; ctx.font = 'bold 24px Arial'; ctx.fillText('Сертификат', 20, 50);
                ctx.font = '18px Arial'; ctx.fillText('Код: ' + code, 20, 90);
                const link = document.createElement('a'); link.download = 'cert_'+code+'.png'; link.href = canvas.toDataURL(); link.click();
            };
            img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(url);
        }

        function rollback(code) {
            if (!confirm('Откатить активацию ' + code + '?')) return;
            jsonp(apiUrl + '?action=deactivate&code=' + code + '&user=' + userParam(), function(d) {
                if (d.success) loadCertificates();
                else alert(d.message);
            });
        }

        // ========== АРХИВ ==========
        function loadArchive() {
            jsonp(apiUrl + '?action=list', function(d) {
                const tbody = document.querySelector('#archiveTable tbody');
                tbody.innerHTML = '';
                (d.codes || []).filter(c => c.status === 'Активирован').forEach(item => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${item.code}</strong></td>
                        <td>${item.date}</td>
                        <td><span class="badge ${item.issued === 'Отдан' ? 'badge-issued' : 'badge-stock'}">${item.issued || 'На складе'}</span></td>
                        <td>
                            <button class="small" onclick="showDetails('${item.code}')">🔍</button>
                            <button class="small danger" onclick="rollback('${item.code}')">↩️</button>
                        </td>`;
                    tbody.appendChild(tr);
                });
            });
        }

        // ========== ЛОГИ ==========
        function loadLogs() {
            jsonp(apiUrl + '?action=logs', function(d) {
                const tbody = document.querySelector('#logsTable tbody');
                tbody.innerHTML = '';
                (d.logs || []).forEach(row => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${row[0]||''}</td><td>${row[1]||''}</td><td>${row[2]||''}</td><td>${row[3]||''}</td><td>${row[4]||''}</td>`;
                    tbody.appendChild(tr);
                });
            });
        }

        // ========== СОЗДАНИЕ СЕРТИФИКАТА ==========
        function openCreateModal() { document.getElementById('createModal').classList.remove('hidden'); }
        function closeCreateModal() { document.getElementById('createModal').classList.add('hidden'); }
        function createCertificate() {
            const code = document.getElementById('newCode').value.trim();
            const duration = document.getElementById('newDuration').value;
            const comment = document.getElementById('newComment').value.trim();
            if (!code) return alert('Введите код');
            jsonp(apiUrl + '?action=create&code=' + code + '&duration=' + duration + '&comment=' + comment + '&user=' + userParam(), function(d) {
                if (d.success) {
                    closeCreateModal();
                    loadCertificates();
                } else alert(d.message);
            });
        }

        // ========== ИНИЦИАЛИЗАЦИЯ ==========
        (function() {
            const saved = localStorage.getItem('cert_logged_in') === 'true' ? localStorage.getItem('cert_user') : null;
            if (saved && USERS.hasOwnProperty(saved)) {
                currentUser = saved;
                initUI();
            } else {
                pages.login.classList.add('active');
            }
            // закрываем боковое меню при клике вне его (мобильная)
            document.addEventListener('click', function(e) {
                if (!sidebar.contains(e.target) && e.target !== document.querySelector('.menu-btn')) {
                    closeSidebar();
                }
            });
        })();
    </script>
</body>
</html>
