<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Самоцветы DEV – Сертификаты</title>
    <!-- QR scanner -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <!-- QR generator (local) -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <style>
        :root {
            --sidebar-width: 280px;
            --header-height: 60px;
            --accent: #ff9f0a;
            --danger: #ff453a;
            --success: #30d158;
            --bg: #121214;
            --card-bg: #1c1c1e;
            --text: #f0f0f5;
            --text-secondary: #98989d;
            --border: #2c2c2e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); -webkit-tap-highlight-color: transparent; }
        body {
            background-image: linear-gradient(rgba(18,18,20,0.75), rgba(18,18,20,0.75)),
                              url('https://img.magnific.com/free-vector/dark-purple-wavy-background_23-2148394397.jpg?semt=ais_hybrid&w=740&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .header {
            height: var(--header-height); background: rgba(28,28,30,0.9); backdrop-filter: blur(15px);
            display: flex; align-items: center; padding: 0 20px;
            border-bottom: 1px solid var(--border); position: fixed; top: 0; left: 0; right: 0; z-index: 30;
        }
        .menu-btn {
            background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; margin-right: 16px;
            display: flex; align-items: center;
        }
        .header-title {
            font-size: 20px; font-weight: 600; color: #fff; display: flex; align-items: center; gap: 10px;
        }
        .logo-img {
            height: 36px; width: 36px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent);
        }

        .sidebar {
            position: fixed; top: var(--header-height); left: 0; bottom: 0;
            width: var(--sidebar-width); background: #1a1a1c; border-right: 1px solid var(--border);
            transform: translateX(-100%); transition: transform 0.3s ease; z-index: 25;
            padding: 20px 0; overflow-y: auto;
        }
        .sidebar.open { transform: translateX(0); }
        .sidebar ul { list-style: none; padding: 0; }
        .sidebar li a, .sidebar li button {
            display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 24px;
            color: #ccc; text-decoration: none; font-size: 16px; background: none; border: none;
            text-align: left; cursor: pointer; transition: background 0.2s;
        }
        .sidebar li a:hover, .sidebar li button:hover { background: #2c2c2e; color: #fff; }
        .sidebar li a.active, .sidebar li button.active { color: var(--accent); background: #1f1f21; }

        .main {
            margin-top: var(--header-height); margin-left: 0;
            padding: 24px; transition: margin-left 0.3s;
        }
        .page { display: none; }
        .page.active { display: block; }

        .card {
            background: var(--card-bg); border-radius: 20px; padding: 24px;
            margin-bottom: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
        }

        .tabs {
            display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 8px;
        }
        .tab {
            background: none; border: none; color: var(--text-secondary); padding: 8px 20px;
            font-size: 15px; font-weight: 500; cursor: pointer; border-radius: 12px; transition: 0.2s;
        }
        .tab.active { background: var(--accent); color: #000; }

        table { width: 100%; border-collapse: collapse; font-size: 15px; }
        th { text-align: left; padding: 12px 8px; border-bottom: 1px solid var(--border); color: var(--text-secondary); font-weight: 600; }
        td { padding: 12px 8px; border-bottom: 1px solid #1c1c1e; vertical-align: middle; }
        .badge {
            display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 13px; font-weight: 600;
        }
        .badge-active { background: #34c759; color: #fff; }
        .badge-inactive { background: #48484a; color: #fff; }
        .badge-issued { background: #0a84ff; color: #fff; }
        .badge-stock { background: #636366; color: #fff; }

        button.primary {
            background: var(--accent); color: #000; border: none; padding: 12px 24px;
            border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        }
        button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
        button.small-btn {
            padding: 6px 12px; font-size: 13px; border-radius: 10px; background: #3a3a3c; color: #fff;
            border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
        }
        button.small-btn:hover { background: #4a4a4c; }

        .hidden { display: none !important; }

        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center;
            z-index: 100; padding: 20px;
        }
        .modal-content {
            background: #1e1e20; border-radius: 24px; padding: 28px; position: relative;
            width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto;
            display: flex; flex-direction: column; align-items: center;
        }
        .modal-lg { max-width: 700px; }
        .close-btn {
            position: absolute; top: 12px; right: 16px; color: var(--accent); font-size: 24px; cursor: pointer; background: none; border: none;
        }

        input, select, textarea {
            background: #2c2c2e; border: 1px solid var(--border); border-radius: 12px;
            padding: 12px; font-size: 15px; color: #fff; width: 100%; margin: 8px 0;
            outline: none; font-family: inherit;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); }

        .spinner {
            border: 4px solid rgba(255,255,255,0.2);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (min-width: 768px) {
            .sidebar { transform: translateX(0); }
            .main { margin-left: var(--sidebar-width); }
            .menu-btn { display: none; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <div class="header-title">
            <img class="logo-img" src="https://sun9-52.userapi.com/s/v1/ig2/FU7bN5q2jKV6WvIw1MQODNfSCOpVecMzuP5FQdOyrofQcIcs-bIRdAjlPtoHyuC1uVQI4rGjL04epRK863qokx-Q.jpg?quality=95&as=32x32,48x48,72x72,108x108,160x160,240x240,360x360,480x480,540x540,640x640,720x720,1024x1024&from=bu&cs=1024x0" alt="Логотип">
            Самоцветы DEV
        </div>
    </header>

    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <ul>
            <li><button onclick="navigate('home')" id="navHome">🏠 Главная</button></li>
            <li id="certsMenuItem"><button onclick="navigate('certs')" id="navCerts">💎 Сертификаты</button></li>
            <li><button onclick="navigate('logs')" id="navLogs">📋 Логи</button></li>
            <li><button onclick="logout()">🚪 Выйти</button></li>
        </ul>
    </nav>

    <!-- Main content -->
    <div class="main" id="mainContent">
        <!-- Login page -->
        <div id="loginPage" class="page active">
            <div class="card" style="max-width: 400px; margin: 0 auto; text-align: center;">
                <img src="https://sun9-52.userapi.com/s/v1/ig2/FU7bN5q2jKV6WvIw1MQODNfSCOpVecMzuP5FQdOyrofQcIcs-bIRdAjlPtoHyuC1uVQI4rGjL04epRK863qokx-Q.jpg?quality=95&as=32x32,48x48,72x72,108x108,160x160,240x240,360x360,480x480,540x540,640x640,720x720,1024x1024&from=bu&cs=1024x0" style="width:80px; border-radius:50%; margin-bottom:16px;">
                <h2>Вход в систему</h2>
                <select id="userSelect">
                    <option value="root">Root</option>
                    <option value="volonter1">Volonter1</option>
                    <option value="volonter2">Volonter2</option>
                </select>
                <input type="password" id="passwordInput" placeholder="Пароль">
                <button class="primary" onclick="login()" style="width:100%;">Войти</button>
                <div id="loginStatus" style="color:red; margin-top:12px;"></div>
            </div>
        </div>

        <!-- QR activation page -->
        <div id="homePage" class="page">
            <div class="card" style="max-width: 500px; margin: 0 auto;">
                <h2 style="margin-bottom:20px; text-align:center;">Активация сертификата</h2>
                <div id="codeDisplay" style="background:#2c2c2e; padding:20px; border-radius:14px; font-size:24px; text-align:center; margin-bottom:16px;">—</div>
                <div id="qrStatus" style="text-align:center; margin-bottom:16px;"></div>
                <button id="activateBtn" class="primary hidden" onclick="activateCode()" style="width:100%;">Активировать</button>
                <div style="display:flex; gap:12px; margin-top:16px; justify-content:center;">
                    <button class="small-btn" onclick="openScanner()">📷 Сканировать</button>
                    <button class="small-btn" onclick="openGallery()">🖼️ Из галереи</button>
                </div>
            </div>
        </div>

        <!-- Certs page -->
        <div id="certsPage" class="page">
            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <h2>Управление сертификатами</h2>
                    <button class="primary" onclick="openCreateModal()">➕ Создать</button>
                </div>
                <div class="tabs">
                    <button class="tab active" onclick="switchCertTab('active')">Активные</button>
                    <button class="tab" onclick="switchCertTab('archive')">Архив</button>
                </div>
                <div class="table-wrap">
                    <table id="certsTable">
                        <thead><tr><th>Код</th><th>Статус</th><th>Выдан</th><th>Действия</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Logs page -->
        <div id="logsPage" class="page">
            <div class="card">
                <h2 style="margin-bottom:16px;">Журнал действий</h2>
                <div class="table-wrap">
                    <table id="logsTable">
                        <thead><tr><th>Время</th><th>Пользователь</th><th>Действие</th><th>Код</th><th>Результат</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
                <button class="primary" onclick="loadLogs()" style="margin-top:16px;">Обновить</button>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <!-- Create cert -->
    <div id="createModal" class="modal hidden">
        <div class="modal-content">
            <button class="close-btn" onclick="closeCreateModal()">&times;</button>
            <h3>Создать сертификат</h3>
            <input type="text" id="newCode" placeholder="Код (GF...)">
            <select id="newDuration">
                <option value="1 день">1 день</option>
                <option value="3 дня">3 дня</option>
                <option value="10 дней">10 дней</option>
                <option value="30 дней">30 дней</option>
                <option value="бессрочно" selected>Бессрочно</option>
            </select>
            <textarea id="newComment" rows="2" placeholder="Комментарий"></textarea>
            <button class="primary" onclick="createCertificate()" style="width:100%; margin-top:12px;">Создать</button>
            <div id="createStatus" style="margin-top:12px;"></div>
        </div>
    </div>

    <!-- Details -->
    <div id="detailsModal" class="modal hidden">
        <div class="modal-content modal-lg">
            <button class="close-btn" onclick="closeDetails()">&times;</button>
            <h3 id="detailsTitle" style="margin-bottom:20px;"></h3>
            <div id="detailsContent" style="font-size:16px; line-height:1.8;"></div>
        </div>
    </div>

    <!-- QR view -->
    <div id="qrModal" class="modal hidden">
        <div class="modal-content">
            <button class="close-btn" onclick="closeQr()">&times;</button>
            <h3 id="qrTitle"></h3>
            <img id="qrImg" style="width:100%; max-width:250px; margin:16px auto; display:block;">
            <input id="qrLink" readonly>
            <button class="primary" onclick="copyQr()" style="width:100%;">📋 Копировать ссылку</button>
        </div>
    </div>

    <!-- Graphic cert (with local QR) -->
    <div id="certDownloadModal" class="modal hidden">
        <div class="modal-content modal-lg">
            <button class="close-btn" onclick="closeCertDownload()">&times;</button>
            <h3 style="margin-bottom:16px;">Сертификат готов</h3>
            <div id="certSpinner" class="spinner"></div>
            <canvas id="certCanvas" style="display:none; width:100%; max-width:700px; border-radius:12px; border:1px solid var(--border);"></canvas>
            <div id="certError" style="color:red; display:none; margin-top:10px;"></div>
            <div style="display:flex; gap:12px; margin-top:16px; justify-content:center;">
                <button class="primary" id="btnDownloadCert" onclick="downloadCertImage()">⬇️ Скачать</button>
                <button class="primary" id="btnCopyCertLink" onclick="copyCertLink()">📋 Копировать ссылку</button>
            </div>
        </div>
    </div>

    <!-- Scanner modal -->
    <div id="scannerModal" class="modal hidden">
        <div class="modal-content">
            <button class="close-btn" onclick="closeScanner()">&times;</button>
            <h3>Сканирование</h3>
            <video id="scannerVideo" autoplay playsinline style="width:100%; border-radius:12px;"></video>
            <p id="scannerStatus" style="margin-top:8px;"></p>
        </div>
    </div>
    <input type="file" id="galleryInput" accept="image/*" onchange="handleFileUpload(event)" class="hidden">

    <script>
        // ========== CONFIGURATION ==========
        const apiUrl = 'https://script.google.com/macros/s/AKfycbyGdOFoHlbOQ5GpAFELjbT6qB0dZ_nQF-r_Rv8868_YIl4bzP9Z4_kVHICow-HAWUkL/exec';   // <--- вставьте ваш URL от Apps Script
        const USERS = { root: 'space1987', volonter1: 'v321', volonter2: 'v987' };

        let currentUser = null;
        let currentCertTab = 'active';
        let qrCode = null;
        let generatingCert = false; // блокировка повторного нажатия на "Сертификат"

        const sidebar = document.getElementById('sidebar');
        const pages = {
            login: document.getElementById('loginPage'),
            home: document.getElementById('homePage'),
            certs: document.getElementById('certsPage'),
            logs: document.getElementById('logsPage')
        };
        const activateBtn = document.getElementById('activateBtn');
        const codeDisplay = document.getElementById('codeDisplay');
        const qrStatus = document.getElementById('qrStatus');
        const scannerModal = document.getElementById('scannerModal');
        const scannerVideo = document.getElementById('scannerVideo');
        const scannerStatus = document.getElementById('scannerStatus');
        const galleryInput = document.getElementById('galleryInput');
        let scanningActive = false;

        // ========== UTILITIES ==========
        function jsonp(url, callback) {
            var script = document.createElement('script');
            var cb = 'jp_' + Math.random().toString(36).substr(2, 9);
            window[cb] = function(d) { delete window[cb]; script.remove(); callback(d); };
            script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
            document.body.appendChild(script);
        }
        function userParam() { return currentUser || 'неизвестный'; }
        function showPage(name) {
            Object.values(pages).forEach(p => p.classList.remove('active'));
            if (pages[name]) pages[name].classList.add('active');
            document.querySelectorAll('.sidebar button').forEach(b => b.classList.remove('active'));
            document.getElementById('navHome').classList.toggle('active', name === 'home');
            document.getElementById('navCerts').classList.toggle('active', name === 'certs');
            document.getElementById('navLogs').classList.toggle('active', name === 'logs');
            if (name === 'home') updateHome();
            if (name === 'certs') loadCertificatesForTab();
            if (name === 'logs') loadLogs();
            closeSidebar();
        }
        function navigate(name) { showPage(name); }
        function toggleSidebar() { sidebar.classList.toggle('open'); }
        function closeSidebar() { sidebar.classList.remove('open'); }

        // ========== AUTH ==========
        function login() {
            const user = document.getElementById('userSelect').value;
            const pass = document.getElementById('passwordInput').value.trim();
            if (!pass) { document.getElementById('loginStatus').textContent = 'Введите пароль'; return; }
            if (USERS[user] === pass) {
                currentUser = user;
                localStorage.setItem('cert_user', user);
                localStorage.setItem('cert_logged_in', 'true');
                initUI();
            } else {
                document.getElementById('loginStatus').textContent = 'Неверный пароль';
            }
        }
        function logout() {
            currentUser = null;
            localStorage.removeItem('cert_user'); localStorage.removeItem('cert_logged_in');
            pages.login.classList.add('active');
            Object.keys(pages).forEach(k => { if (k !== 'login') pages[k].classList.remove('active'); });
            closeSidebar();
            document.getElementById('passwordInput').value = '';
            document.getElementById('loginStatus').textContent = '';
        }
        function initUI() {
            pages.login.classList.remove('active');
            document.getElementById('certsMenuItem').classList.toggle('hidden', currentUser !== 'root');
            showPage('home');
        }

        // ========== QR ACTIVATION ==========
        function updateHome() {
            qrCode = new URLSearchParams(window.location.search).get('code') || qrCode;
            if (qrCode) {
                codeDisplay.textContent = qrCode;
                checkStatusForActivation(qrCode);
            } else {
                codeDisplay.textContent = '—';
                qrStatus.textContent = '';
                activateBtn.classList.add('hidden');
            }
        }
        function checkStatusForActivation(code) {
            jsonp(apiUrl + '?action=status&code=' + code, function(d) {
                if (d.error || d.status === 'unknown') {
                    qrStatus.innerHTML = '<span style="color:#ff453a;">❌ Неизвестный код</span>';
                    activateBtn.classList.add('hidden');
                } else if (d.status === 'Активирован') {
                    qrStatus.innerHTML = '<span style="color:#ff453a;">❌ Уже активирован</span>';
                    activateBtn.classList.add('hidden');
                } else {
                    qrStatus.innerHTML = '';
                    activateBtn.classList.remove('hidden');
                }
            });
        }
        function activateCode() {
            if (!qrCode) return;
            activateBtn.disabled = true;
            jsonp(apiUrl + '?action=activate&code=' + qrCode + '&user=' + userParam(), function(d) {
                activateBtn.disabled = false;
                if (d.success) {
                    qrStatus.innerHTML = '<span style="color:#30d158;">✅ ' + d.message + '</span>';
                    activateBtn.classList.add('hidden');
                    if (currentPage === 'certs') loadCertificatesForTab();
                } else {
                    qrStatus.innerHTML = '<span style="color:#ff453a;">❌ ' + d.message + '</span>';
                }
            });
        }

        // Scanner & gallery
        function openScanner() {
            scannerModal.classList.remove('hidden');
            scanningActive = true;
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(stream => {
                scannerVideo.srcObject = stream;
                scannerVideo.play();
                scanLoop();
            }).catch(() => { scannerStatus.textContent = 'Нет доступа к камере'; });
        }
        function scanLoop() {
            if (!scanningActive) return;
            if (scannerVideo.readyState === scannerVideo.HAVE_ENOUGH_DATA) {
                const canvas = document.createElement('canvas');
                canvas.width = scannerVideo.videoWidth; canvas.height = scannerVideo.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(scannerVideo, 0, 0);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, canvas.width, canvas.height);
                if (code) {
                    scanningActive = false;
                    closeScanner();
                    setQrCode(code.data);
                }
            }
            requestAnimationFrame(scanLoop);
        }
        function closeScanner() {
            scanningActive = false;
            if (scannerVideo.srcObject) scannerVideo.srcObject.getTracks().forEach(t => t.stop());
            scannerModal.classList.add('hidden');
        }
        function openGallery() { galleryInput.click(); }
        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width; canvas.height = img.height;
                    canvas.getContext('2d').drawImage(img, 0, 0);
                    const imageData = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, canvas.width, canvas.height);
                    if (code) setQrCode(code.data);
                    else alert('QR не найден');
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
            galleryInput.value = '';
        }
        function setQrCode(code) {
            qrCode = code;
            codeDisplay.textContent = code;
            checkStatusForActivation(code);
            window.history.replaceState(null, '', '?code=' + code);
        }

        // ========== CERTIFICATE MANAGEMENT ==========
        function switchCertTab(tab) {
            currentCertTab = tab;
            document.querySelectorAll('.tab').forEach((b, idx) => {
                b.classList.toggle('active', (idx === 0 && tab === 'active') || (idx === 1 && tab === 'archive'));
            });
            loadCertificatesForTab();
        }
        function loadCertificatesForTab() {
            jsonp(apiUrl + '?action=list', function(d) {
                const tbody = document.querySelector('#certsTable tbody');
                tbody.innerHTML = '';
                let codes = d.codes || [];
                if (currentCertTab === 'active') {
                    codes = codes.filter(c => c.status !== 'Активирован');
                } else {
                    codes = codes.filter(c => c.status === 'Активирован');
                }
                codes.forEach(item => {
                    const tr = document.createElement('tr');
                    const issueBtn = (currentUser === 'root') ?
                        `<button class="small-btn" onclick="toggleIssue('${item.code}')">${item.issued === 'Отдан' ? '📦 На склад' : '📤 Отдать'}</button>` : '';
                    tr.innerHTML = `
                        <td><strong>${item.code}</strong></td>
                        <td><span class="badge ${item.status === 'Активирован' ? 'badge-active' : 'badge-inactive'}">${item.status}</span></td>
                        <td><span class="badge ${item.issued === 'Отдан' ? 'badge-issued' : 'badge-stock'}">${item.issued || 'На складе'}</span></td>
                        <td style="display:flex; gap:6px; flex-wrap:wrap;">
                            <button class="small-btn" onclick="showDetails('${item.code}')">🔍 Инфо</button>
                            ${issueBtn}
                            <button class="small-btn" onclick="showQr('${item.code}')">📷 QR</button>
                            <button class="small-btn" onclick="generateCertImage('${item.code}')">🎨 Сертификат</button>
                            ${(item.status === 'Активирован') ? `<button class="small-btn danger" onclick="rollback('${item.code}')">↩️ Восстановить</button>` : ''}
                        </td>`;
                    tbody.appendChild(tr);
                });
            });
        }
        function toggleIssue(code) {
            jsonp(apiUrl + '?action=toggleIssue&code=' + code + '&user=' + userParam(), function(d) {
                if (d.success) loadCertificatesForTab();
                else alert(d.message);
            });
        }
        function showDetails(code) {
            jsonp(apiUrl + '?action=list', function(d) {
                const item = (d.codes || []).find(c => c.code === code);
                if (!item) return;
                document.getElementById('detailsTitle').textContent = 'Детали сертификата ' + code;
                document.getElementById('detailsContent').innerHTML = `
                    <p><strong>Статус активации:</strong> ${item.status}</p>
                    <p><strong>Дата создания:</strong> ${item.date}</p>
                    <p><strong>Срок действия:</strong> ${item.duration}</p>
                    <p><strong>Комментарий:</strong> ${item.comment}</p>
                    <p><strong>Статус выдачи:</strong> ${item.issued || 'На складе'}</p>
                `;
                document.getElementById('detailsModal').classList.remove('hidden');
            });
        }
        function closeDetails() { document.getElementById('detailsModal').classList.add('hidden'); }
        function showQr(code) {
            const url = window.location.origin + window.location.pathname + '?code=' + code;
            document.getElementById('qrTitle').textContent = 'QR для ' + code;
            document.getElementById('qrImg').src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(url);
            document.getElementById('qrLink').value = url;
            document.getElementById('qrModal').classList.remove('hidden');
        }
        function closeQr() { document.getElementById('qrModal').classList.add('hidden'); }
        function copyQr() {
            navigator.clipboard.writeText(document.getElementById('qrLink').value);
            alert('Ссылка скопирована');
        }
        function rollback(code) {
            if (!confirm('Восстановить сертификат ' + code + '?')) return;
            jsonp(apiUrl + '?action=deactivate&code=' + code + '&user=' + userParam(), function(d) {
                if (d.success) loadCertificatesForTab();
                else alert(d.message);
            });
        }

        // ========== GRAPHIC CERTIFICATE (local QR, no network dependency) ==========
        function generateCertImage(code) {
            if (generatingCert) return;
            generatingCert = true;
            const modal = document.getElementById('certDownloadModal');
            const spinner = document.getElementById('certSpinner');
            const canvas = document.getElementById('certCanvas');
            const errorDiv = document.getElementById('certError');
            const btnDownload = document.getElementById('btnDownloadCert');
            const btnCopy = document.getElementById('btnCopyCertLink');

            modal.classList.remove('hidden');
            spinner.style.display = 'block';
            canvas.style.display = 'none';
            errorDiv.style.display = 'none';
            btnDownload.disabled = true;
            btnCopy.disabled = true;

            jsonp(apiUrl + '?action=list', function(d) {
                const item = (d.codes || []).find(c => c.code === code);
                if (!item) {
                    errorDiv.textContent = 'Сертификат не найден в базе.';
                    errorDiv.style.display = 'block';
                    spinner.style.display = 'none';
                    generatingCert = false;
                    return;
                }

                canvas.width = 800;
                canvas.height = 500;
                const ctx = canvas.getContext('2d');
                // Фон
                ctx.fillStyle = '#1c1c1e';
                ctx.fillRect(0, 0, 800, 500);
                ctx.strokeStyle = '#ff9f0a';
                ctx.lineWidth = 3;
                ctx.strokeRect(10, 10, 780, 480);

                // Логотип
                const logo = new Image();
                logo.crossOrigin = 'Anonymous';
                logo.src = 'https://sun9-52.userapi.com/s/v1/ig2/FU7bN5q2jKV6WvIw1MQODNfSCOpVecMzuP5FQdOyrofQcIcs-bIRdAjlPtoHyuC1uVQI4rGjL04epRK863qokx-Q.jpg?quality=95&as=32x32,48x48,72x72,108x108,160x160,240x240,360x360,480x480,540x540,640x640,720x720,1024x1024&from=bu&cs=1024x0';
                logo.onload = function() {
                    ctx.drawImage(logo, 30, 30, 64, 64);
                    addTextAndQR();
                };
                logo.onerror = function() {
                    // продолжаем без логотипа
                    addTextAndQR();
                };

                function addTextAndQR() {
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 28px Arial';
                    ctx.fillText('Подарочный сертификат', 120, 70);
                    ctx.font = '20px Arial';
                    ctx.fillText('Самоцветы DEV', 120, 100);
                    ctx.font = '24px Arial';
                    ctx.fillText('Код: ' + code, 40, 160);
                    ctx.fillText('Срок действия: ' + item.duration, 40, 200);
                    if (item.comment) {
                        ctx.font = '18px Arial';
                        ctx.fillText('Комментарий: ' + item.comment, 40, 240);
                    }

                    // Генерируем QR локально
                    try {
                        const qrUrl = window.location.origin + window.location.pathname + '?code=' + code;
                        const qr = qrcode(0, 'M');
                        qr.addData(qrUrl);
                        qr.make();
                        const tileSize = 4;
                        const qrSize = qr.getModuleCount() * tileSize;
                        const qrX = 580;
                        const qrY = 280;
                        // белая подложка
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(qrX - 4, qrY - 4, qrSize + 8, qrSize + 8);
                        for (let row = 0; row < qr.getModuleCount(); row++) {
                            for (let col = 0; col < qr.getModuleCount(); col++) {
                                if (qr.isDark(row, col)) {
                                    ctx.fillStyle = '#000000';
                                    ctx.fillRect(qrX + col * tileSize, qrY + row * tileSize, tileSize, tileSize);
                                }
                            }
                        }
                        // отображаем canvas
                        spinner.style.display = 'none';
                        canvas.style.display = 'block';
                        btnDownload.disabled = false;
                        btnCopy.disabled = false;
                        window._certCode = code;
                    } catch (e) {
                        errorDiv.textContent = 'Ошибка при создании QR-кода.';
                        errorDiv.style.display = 'block';
                        spinner.style.display = 'none';
                    }
                    generatingCert = false;
                }
            });
        }

        function closeCertDownload() {
            document.getElementById('certDownloadModal').classList.add('hidden');
            document.getElementById('certSpinner').style.display = 'none';
            document.getElementById('certCanvas').style.display = 'none';
            document.getElementById('certError').style.display = 'none';
            generatingCert = false;
        }
        function downloadCertImage() {
            const canvas = document.getElementById('certCanvas');
            if (!canvas || canvas.style.display === 'none') return;
            const link = document.createElement('a');
            link.download = 'certificate_' + (window._certCode || 'unknown') + '.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        function copyCertLink() {
            if (!window._certCode) return;
            const url = window.location.origin + window.location.pathname + '?code=' + window._certCode;
            navigator.clipboard.writeText(url).then(() => alert('Ссылка скопирована'));
        }

        // ========== CREATE CERT ==========
        function openCreateModal() { document.getElementById('createModal').classList.remove('hidden'); }
        function closeCreateModal() { document.getElementById('createModal').classList.add('hidden'); }
        function createCertificate() {
            const code = document.getElementById('newCode').value.trim().replace(/[^A-Za-z0-9]/g, '');
            const duration = document.getElementById('newDuration').value;
            const comment = document.getElementById('newComment').value.trim();
            if (!code) return alert('Введите код');
            const btn = document.querySelector('#createModal button.primary');
            btn.disabled = true;
            jsonp(apiUrl + '?action=create&code=' + code + '&duration=' + duration + '&comment=' + comment + '&user=' + userParam(), function(d) {
                btn.disabled = false;
                if (d.success) {
                    closeCreateModal();
                    loadCertificatesForTab();
                } else {
                    alert(d.message);
                }
            });
        }

        // ========== LOGS ==========
        function loadLogs() {
            jsonp(apiUrl + '?action=logs', function(d) {
                const tbody = document.querySelector('#logsTable tbody');
                tbody.innerHTML = '';
                (d.logs || []).forEach(row => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${row[0]||''}</td><td>${row[1]||''}</td><td>${row[2]||''}</td><td>${row[3]||''}</td><td>${row[4]||''}</td>`;
                    tbody.appendChild(tr);
                });
            });
        }

        // ========== INIT ==========
        (function() {
            const saved = localStorage.getItem('cert_logged_in') === 'true' ? localStorage.getItem('cert_user') : null;
            if (saved && USERS.hasOwnProperty(saved)) {
                currentUser = saved;
                initUI();
            } else {
                pages.login.classList.add('active');
            }
            document.addEventListener('click', function(e) {
                if (!sidebar.contains(e.target) && e.target !== document.querySelector('.menu-btn')) closeSidebar();
            });
        })();
    </script>
</body>
</html>
