<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Активация сертификата</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #121214; -webkit-text-size-adjust: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 20px;
            -webkit-tap-highlight-color: transparent;
        }
        .card {
            background: #1e1e20; border-radius: 24px; box-shadow: 0 12px 36px rgba(0,0,0,0.6);
            padding: 40px 24px 32px; max-width: 100%; width: 100%;
            text-align: center; border: 1px solid #2c2c2e;
        }
        .icon { font-size: 48px; margin-bottom: 16px; }
        h2 { font-size: 26px; font-weight: 650; color: #f0f0f5; margin-bottom: 4px; }
        .subtitle { font-size: 15px; color: #ff9f0a; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 24px; }
        .code-block {
            background: #18181a; border: 1px solid #2c2c2e; border-radius: 16px;
            padding: 18px; margin: 20px 0;
            font-family: 'SF Mono', monospace; font-size: 24px; font-weight: 600;
            color: #f0f0f5; word-break: break-all;
        }
        .status { font-size: 18px; margin: 20px 0; font-weight: 500; }
        .status.error { color: #ff453a; }
        .status.success { color: #34c759; }
        button {
            background: #ff9f0a; color: #000; font-size: 20px; font-weight: 650;
            padding: 16px 32px; border: none; border-radius: 34px;
            width: 100%; max-width: 280px; margin-top: 16px;
            cursor: pointer; transition: 0.15s; box-shadow: 0 6px 20px rgba(255,159,10,0.3);
            -webkit-appearance: none;
        }
        button:active { transform: scale(0.97); background: #e58c00; }
        button:disabled { background: #555; color: #2c2c2e; box-shadow: none; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🎁</div>
        <h2>Активация сертификата</h2>
        <div class="subtitle">Самоцветы DEV</div>
        <div class="code-block" id="codeDisplay"></div>
        <div id="statusArea" class="status"></div>
        <button id="activateBtn" class="hidden" onclick="activate()">Активировать</button>
    </div>

    <script>
        // ПОМЕНЯЙТЕ ЭТУ ССЫЛКУ НА ВАШ НОВЫЙ URL, ПОЛУЧЕННЫЙ ПОСЛЕ "НОВОГО РАЗВЁРТЫВАНИЯ"
        const apiUrl = 'https://script.google.com/macros/s/AKfycbxC_zLvwMynx92yyFjp438BlSorR09bTIPJbLFoNU7tpSpw6rI6LAtexloU2hlo0iK6/exec';
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');

        const codeDisplay = document.getElementById('codeDisplay');
        const statusDiv = document.getElementById('statusArea');
        const btn = document.getElementById('activateBtn');

        function showStatus(message, isError = true) {
            statusDiv.textContent = message;
            statusDiv.className = `status ${isError ? 'error' : 'success'}`;
        }

        async function checkStatus() {
            try {
                const response = await fetch(`${apiUrl}?action=status&code=${encodeURIComponent(code)}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                if (data.error) throw new Error(data.error);
                if (data.status === 'Активирован') {
                    showStatus('❌ Этот сертификат уже активирован.', true);
                } else if (data.status === 'unknown') {
                    showStatus('❌ Неизвестный код сертификата.', true);
                } else {
                    statusDiv.textContent = '';
                    btn.classList.remove('hidden');
                }
            } catch (err) {
                showStatus('Ошибка соединения: ' + err.message, true);
            }
        }

        async function activate() {
            btn.disabled = true;
            btn.textContent = 'Активация...';
            try {
                const response = await fetch(`${apiUrl}?action=activate&code=${encodeURIComponent(code)}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                if (data.error) throw new Error(data.error);
                if (data.success) {
                    showStatus('✅ ' + data.message, false);
                    btn.classList.add('hidden');
                } else {
                    showStatus('❌ ' + (data.message || 'Неизвестная ошибка'), true);
                    btn.disabled = false;
                    btn.textContent = 'Активировать';
                }
            } catch (err) {
                showStatus('Ошибка соединения: ' + err.message, true);
                btn.disabled = false;
                btn.textContent = 'Активировать';
            }
        }

        if (!code) {
            codeDisplay.textContent = '—';
            showStatus('Нет кода сертификата.', true);
        } else {
            codeDisplay.textContent = code;
            checkStatus();
        }
    </script>
</body>
</html>
